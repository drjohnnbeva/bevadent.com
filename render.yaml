# Blueprint de Render: un solo servicio que sirve la página, la app y la API de cobro.
services:
  - type: web
    name: odontocostos
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_FOUNDER_COUPON
        sync: false
      - key: STRIPE_PORTAL_CONFIG
        sync: false
      - key: GOOGLE_AUTH
        value: "0"
      - key: SUPPORT_EMAIL
        sync: false
